name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 유닛 테스트는 pglite(in-memory Postgres) 사용으로 외부 의존성 없이 실행됨.
      # e2e 는 서버·DB 가 필요해 build job 에서 돈다.
      - name: Unit tests
        run: npm run test

  build:
    name: Build, E2E & Lighthouse
    runs-on: ubuntu-latest
    services:
      # 빌드가 DB를 요구한다 — src/lib/db/index.ts 가 모듈 최상위에서 접속을 만들고,
      # 상세 4개 라우트가 generateStaticParams 에서 실제로 읽는다.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ycc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # drizzle-kit 은 이 URL로 TCP 접속하고, 앱은 아래 프록시를 거쳐 HTTP로 붙는다.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ycc
      NEON_HTTP_PROXY: http://localhost:4444/sql
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-real-sessions
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # neon-http 드라이버는 Postgres 와이어 프로토콜이 아니라 HTTP로 말한다.
      # 이 프록시가 그 요청을 위 서비스 컨테이너의 Postgres 로 옮긴다.
      - name: Start Neon HTTP proxy
        run: |
          docker run -d --name neon-proxy --network host \
            -e PG_CONNECTION_STRING=postgres://postgres:postgres@localhost:5432/ycc \
            ghcr.io/timowilhelm/local-neon-http-proxy:main
          # 응답 코드는 상관없다 — 연결이 붙는지(exit 7이 아닌지)만 본다.
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4444/sql && exit 0
            sleep 1
          done
          echo 'neon proxy did not come up'; docker logs neon-proxy; exit 1

      - name: Migration integrity
        run: npm run db:check

      - name: Migrate
        run: npm run db:migrate

      # 빈 DB로 재면 목록·상세가 전부 비어 접근성·SEO 점수가 실사이트와 달라진다.
      - name: Seed
        run: npm run db:seed

      - name: Build
        run: npm run build

      # 공개 화면만 읽는 스펙(playwright.config.ts 의 ci 프로젝트). 관리자 로그인과
      # 실 R2 쓰기가 필요한 나머지는 로컬 전용이다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (자격 증명 불필요 스펙)
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
